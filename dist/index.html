ata Cleaning",description:"Outlier filtering & missing value handling"},{label:"Exploratory Analysis",description:"Descriptive statistics & bivariate correlation"},{label:"K-Means Clustering",description:"Unsupervised socio-economic segmentation"},{label:"SMOTE Resampling",description:"Class balancing for minority vulnerability classes"},{label:"Decision Tree Modeling",description:"Supervised predictive classification"},{label:"Prediction & Validation",description:"Model evaluation & precision metrics"},{label:"Visualization & Mapping",description:"ArcGIS spatial mapping & executive charts"}],overview:"Climate-induced floods in the Imbo Plain present severe economic threats to vulnerable households. This analytical project establishes a quantitative framework for assessing vulnerability by combining field survey data, geographical spatial analysis, and predictive machine learning models.",problem:"Humanitarian organizations and local decision-makers often lack high-resolution, predictive data on which households are most at risk of severe economic collapse during flood events, leading to suboptimal emergency relief allocation.",objectives:["Quantify household vulnerability drivers across demographic, economic, and geographical dimensions.","Segment households into clear vulnerability profiles to assist targeted aid deployment.","Build a machine learning predictive model capable of classifying household vulnerability risk with high accuracy."],approach:"The project adopted an end-to-end data science lifecycle. Field data collected via KoboToolbox was cleaned in Python, geo-referenced in ArcGIS, and segmented via K-Means. SMOTE was applied to balance target classes before training Decision Tree classifiers.",demoType:"data-pipeline",demoData:{clusters:[{name:"Extreme Vulnerability",share:"28%",incomeDrop:"-65%",resilienceScore:2.1},{name:"High Risk",share:"34%",incomeDrop:"-42%",resilienceScore:4.3},{name:"Moderate Resilience",share:"23%",incomeDrop:"-18%",resilienceS
