ndling"},{label:"Exploratory Analysis",description:"Descriptive statistics & bivariate correlation"},{label:"K-Means Clustering",description:"Unsupervised socio-economic segmentation"},{label:"SMOTE Resampling",description:"Class balancing for minority vulnerability classes"},{label:"Decision Tree Modeling",description:"Supervised predictive classification"},{label:"Prediction & Validation",description:"Model evaluation & precision metrics"},{label:"Visualization & Mapping",description:"ArcGIS spatial mapping & executive charts"}],overview:"Climate-induced floods in the Imbo Plain present severe economic threats to vulnerable households. This analytical project establishes a quantitative framework for assessing vulnerability by combining field survey data, geographical spatial analysis, and predictive machine learning models.",problem:"Humanitarian organizations and local decision-makers often lack high-resolution, predictive data on which households are most at risk of severe economic collapse during flood events, leading to suboptimal emergency relief allocation.",objectives:["Quantify household vulnerability drivers across demographic, economic, and geographical dimensions.","Segment households into clear vulnerability profiles to assist targeted aid deployment.","Build a machine learning predictive model capable of classifying household vulnerability risk with high accuracy."],approach:"The project adopted an end-to-end data science lifecycle. Field data collected via KoboToolbox was cleaned in Python, geo-referenced in ArcGIS, and segmented via K-Means. SMOTE was applied to balance target classes before training Decision Tree classifiers.",demoType:"data-pipeline",demoData:{clusters:[{name:"Extreme Vulnerability",share:"28%",incomeDrop:"-65%",resilienceScore:2.1},{name:"High Risk",share:"34%",incomeDrop:"-42%",resilienceScore:4.3},{name:"Moderate Resilience",share:"23%",incomeDrop:"-18%",resilienceScore:6.8},{name:"Stable / Resilient",share:"15%",incomeDrop:"-5%",resilienceScore:8.5}],modelMetrics:{accuracy:"91.4%",precision:"89.2%",recall:"93.1%",f1Score:"91.1%"}},githubUrl:"https://github.com/Redempteur/flood-vulnerability-analysis"},{id:"project-02",title:"IOM Migration Health Assessment Clinic Data System",category:"Data Quality & Information Management",tagline:"High-integrity medical record tracking and statistical quality control for international resettlement.",description:"A specialized data processing framework managed at the International Organization for Migration (IOM) for processing, validating, and tracking migrant health records across UK, Australia, Canada, France, Belgium, and USRAP resettlement programs.",technologies:["IOM Data Systems","SQL","Python","Data Quality Control","Medical Data Validation","Statistical Reporting","Resettlement Tracking"],keyContributions:["Managed quality control procedures for immigrant medical clinic data across multi-country departure pipelines.","Executed systematic error detection, database reconciliation, and medical record follow-up until final departure.","Coordinated with partner health clinics and embassies to ensure timely service payment and record tracking.","Published regular statistical reports on migration health indicators for senior management."],results:["Maintained 100% data audit compliance for international resettlement medical records (07/2019 – 03/2025).","Eliminated processing bottlenecks, accelerating migrant health clearing times for resettlement partner countries.","Guaranteed strict data confidentiality and compliance with international health standards."],methodology:[{label:"Clinic Data Intake",description:"Medical assessment intake & record logging"},{label:"Quality Control",description:"Diagnostic verification & missing data checks"},{label:"Database Error Resolution",description:"Systematic record reconciliation"},{label:"Partner Coordination",description:"Tracking records with clinic partners & embassies"},{label:"Resettlement Clearing",description:"Final clearance validation for departure"},{label:"Statistical Reporting",description:"Publishing routine migration health statistics"}],overview:"International refugee resettlement programs require uncompromising accuracy in health data processing. At IOM, this system ensured that all medical records met strict receiving-country health guidelines.",problem:"Errors or delays in migrant health assessments can stall resettlement departures, create partner payment friction, and compromise health data integrity.",objectives:["Establish automated and manual audit controls for clinic data entry.","Maintain real-time tracking of medical records from initial clinic screening to final flight departure.","Ensure full compliance with receiving country health regulations (UK, Canada, Australia, France, Belgium, USRAP)."],approach:"Combined systematic SQL and database validation rules with multi-clinic coordination protocols, creating a zero-error medical record workflow.",demoType:"interactive-chart",demoData:{initialErrors:312,cleanedErrors:0,qualityScore:"100%"},githubUrl:"https://github.com/Redempteur/"},{id:"project-03",title:"FHI 360 / PEPFAR PMTCT & M&E Indicator Dashboard",category:"Business Intelligence & M&E",tagline:"USAID/PEPFAR DATIM indicator tracking, SIMS scorecards, and DQA data quality audits.",description:"An enterprise M&E indicator monitoring and Data Quality Assessment (DQA) solution developed for FHI 360 under the USAID/PEPFAR-funded IHPB project, tracking PMTCT, early PCR, and MNCH indicators across Burundi.",technologies:["Power BI","DATIM","SIMS","DHIS2","DQA Audits","M&E Scorecards","USAID / PEPFAR","SPSS"],keyContributions:["Architected M&E indicator dashboards tracking PMTCT and early PCR integration in maternal health centers.","Led routine Data Quality Assessments (DQAs) and SIMS evaluations across partner health centers.","Strengthened provider capacity through routine SIS analysis meetings and data quality supervision.","Updated central
